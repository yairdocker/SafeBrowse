name: Security regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: |
          for script in *.sh scripts/*.sh; do [ ! -f "$script" ] || bash -n "$script" || exit 1; done
      - name: Offline failure-path regressions
        run: python3 -m unittest discover -s tests -v
      - name: Compose validation
        env:
          SANDBOX_PASSWORD: validation-only-not-a-session
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.vpn.yml config --quiet
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'  # the supported minimum
      # Read-only. The log of this step is the record of what the runner actually is; a
      # hosted runner is not assumed to be a stock Ubuntu installation.
      - name: Record host and daemon security settings
        run: python3 tests/host_baseline.py
      # Both suites run the verifier, which requires the approved seccomp profile, an
      # observed outer filter and, where the daemon has AppArmor, docker-default in enforce mode.
      - name: Real container security and session regressions
        run: python3 tests/integration.py
      - name: Real launcher lifecycle against a disposable fixture
        run: python3 tests/cli_integration.py
      # The production VPN topology, image, firewall and verifier against a WireGuard peer that is
      # another container: tunnel traffic, kill switch under injected faults, mode changes, secrets.
      - name: Real launcher in VPN mode against a controlled WireGuard peer
        run: python3 tests/integration_vpn.py
      # Fails if the runner departs from the Linux baseline (for example a relaxed
      # user-namespace restriction), so green suites are not mistaken for baseline evidence.
      - name: Host matches the documented Linux baseline
        if: always()
        run: python3 tests/host_baseline.py --require-linux-baseline
