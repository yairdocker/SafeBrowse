# ---------------------------------------------------------------------------
# safebrowse - disposable hardened Chromium with filtered egress.
#
#   host :3011 ──► uiproxy ──(internal)──► safebrowse (Chromium)
#                                              │
#                                              └──► gateway (Squid) ──► internet
#
# The browser sits on an internal-only Docker network. It has no default
# route, no DNS of its own, and no published ports. Its single path to the
# outside world is the Squid gateway, which refuses private address space,
# non-web ports, and anything on the blocklist.
# ---------------------------------------------------------------------------

services:

  # --- the only way out ----------------------------------------------------
  gateway:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: safebrowse-gw
    hostname: gateway
    volumes:
      - ./gateway/squid.conf:/etc/squid/squid.conf:ro
      - ./gateway/blocklist.txt:/etc/squid/blocklist.txt:ro
    networks:
      sandbox_net:
        ipv4_address: 172.28.0.2
      egress_net:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:          # squid creates its cache dirs then drops to the proxy user
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 512m
    pids_limit: 256
    restart: "no"

  # --- publishes the remote desktop, because an internal-network container
  #     cannot publish ports itself. Raw TCP passthrough: TLS stays
  #     end-to-end between your Mac and the browser container.
  uiproxy:
    image: alpine/socat@sha256:ef6c281978dcd6927d9b3829484e4c4fdfc5d98de5acbd6312c04565d2d58cbf
    container_name: safebrowse-ui
    command: ["TCP-LISTEN:3001,fork,reuseaddr", "TCP:safebrowse:3001"]
    ports:
      - "127.0.0.1:3011:3001"
    networks:
      sandbox_net:
      egress_net:
    depends_on:
      - safebrowse
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 128
    restart: "no"

  # --- the untrusted thing (Firefox) -------------------------------------------------
  safebrowse:
    build:
      context: .
    image: safebrowse:latest
    container_name: safebrowse
    hostname: sandbox

    # No ports. No route off sandbox_net except through gateway.
    networks:
      sandbox_net:

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Australia/Melbourne
      - CUSTOM_USER=${SANDBOX_USER:-sandbox}
      - PASSWORD=${SANDBOX_PASSWORD:?set SANDBOX_PASSWORD in .env}
      - TITLE=safebrowse
      # The proxy, the ad blocker and every permission are set by Firefox
      # enterprise policy (policies/firefox-policies.json), which a page
      # cannot override. Nothing security-relevant rides on this flag.
      - FIREFOX_CLI=about:blank

      # --- close the bridges between your Mac and the sandbox -------------
      # The remote desktop syncs the clipboard both ways by default and offers
      # file upload/download through the web UI. Both are data paths in and out
      # of an environment whose whole purpose is that nothing crosses it.
      - SELKIES_CLIPBOARD_ENABLED=false
      - SELKIES_CLIPBOARD_IN_ENABLED=false
      - SELKIES_CLIPBOARD_OUT_ENABLED=false
      - SELKIES_ENABLE_BINARY_CLIPBOARD=false
      # Ignored by this image: it rejects both "none" and "" and falls back to
      # upload,download. Left here to record the intent. Hiding the panel below
      # removes the affordance but is cosmetic, not a control.
      - SELKIES_FILE_TRANSFERS=
      - SELKIES_UI_SIDEBAR_SHOW_FILES=false
      - SELKIES_MICROPHONE_ENABLED=false

    # No dns: key here on purpose. Docker's embedded resolver stays in place
    # for container names; every external lookup happens at the gateway.

    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700,size=1g
      - /tmp:size=256m
      - /run:exec,size=64m

    security_opt:
      - no-new-privileges:true
      # Required, not optional. Docker's default seccomp profile gates
      # clone(CLONE_NEWUSER) behind CAP_SYS_ADMIN, and no-new-privileges
      # neuters the SUID helper - so BOTH of Chromium's sandbox mechanisms are
      # unavailable and renderers run completely unconfined ("No usable
      # sandbox!"). Relaxing the outer filter is the cheaper trade: it buys
      # back Chromium's own per-renderer seccomp-bpf and namespace isolation,
      # which is the layer that actually contains hostile JavaScript.
      # The alternative, cap_add: SYS_ADMIN, keeps seccomp but hands the
      # container the single most escape-prone capability. Worse.
      - seccomp=unconfined
    cap_drop:
      - ALL
    cap_add:          # the minimum s6-overlay needs to start and drop to uid 1000
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - KILL

    mem_limit: 4g
    cpus: 4.0
    pids_limit: 1024
    shm_size: "1gb"
    depends_on:
      - gateway
    restart: "no"

networks:
  # internal: true means Docker installs a firewall rule dropping anything
  # entering this bridge from outside its own subnet, and gives members no
  # NAT to the internet. That is the containment.
  sandbox_net:
    name: safebrowse_sandbox
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24

  egress_net:
    name: safebrowse_egress
    driver: bridge
