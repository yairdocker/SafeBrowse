# ---------------------------------------------------------------------------
# safebrowse - disposable hardened Firefox with filtered egress. DIRECT mode.
#
#   host :3011 ──► uiproxy ──(internal)──► safebrowse (Firefox)
#                                              │
#                                              └──► gateway (Squid) ──► internet
#
# The browser sits on an internal-only Docker network. It has no default
# route and no published ports. Docker DNS still resolves container names.
# Its configured web path to the outside world is the Squid gateway, which refuses private address space,
# non-web ports, and anything on the blocklist.
#
# This is one complete topology. The VPN topology is docker-compose.vpn.yml;
# the launcher selects exactly one of the two files and never layers them.
# What the services run is defined once, in compose.services.yml.
# ---------------------------------------------------------------------------

services:

  gateway:
    extends:
      file: compose.services.yml
      service: gateway
    hostname: gateway
    labels:
      safebrowse.mode: direct
    networks:
      sandbox_net:
      egress_net:

  uiproxy:
    extends:
      file: compose.services.yml
      service: uiproxy
    labels:
      safebrowse.mode: direct
    networks:
      sandbox_net:
      egress_net:
    depends_on:
      - safebrowse

  safebrowse:
    extends:
      file: compose.services.yml
      service: safebrowse
    labels:
      safebrowse.mode: direct
    # No ports. No route off sandbox_net except through gateway.
    networks:
      sandbox_net:
    depends_on:
      - gateway

# Keep these two definitions identical in docker-compose.vpn.yml.
networks:
  # internal: true means Docker installs a firewall rule dropping anything
  # entering this bridge from outside its own subnet, and gives members no
  # NAT to the internet. Isolated gateway mode also removes the bridge host address.
  sandbox_net:
    name: safebrowse_sandbox
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        # run.sh supplies an unused subnet; this fallback supports direct Compose use.
        - subnet: ${SANDBOX_SUBNET:-172.28.0.0/24}

  egress_net:
    name: safebrowse_egress
    driver: bridge
