# ---------------------------------------------------------------------------
# safebrowse - disposable hardened Firefox with filtered egress. VPN mode.
#
#   host :3011 ──► uiproxy ──(internal)──► safebrowse (Firefox)
#                                              │
#                                              └──► gateway (Squid) ─┐ one network
#                                                   vpn (Gluetun) ───┘ namespace
#                                                        │
#                                                        └──► WireGuard ──► internet
#
# Squid has no network of its own here: it runs inside the VPN container's
# network namespace, where a firewall lets it speak only to the browser and
# into the tunnel. The browser still reaches it as gateway:3128, on the same
# isolated bridge, under the same locked Firefox policy. If the tunnel is
# down, nothing leaves: there is no fallback to the direct topology.
#
# This is one complete topology, selected by the launcher instead of
# docker-compose.yml. Do not layer it over that file. See VPN_SECURITY.md.
# ---------------------------------------------------------------------------

services:

  # --- owns the sandbox and egress interfaces; the only route out is the tunnel
  vpn:
    # Gluetun v3.41.3 (commit 3d1e20c). Multi-architecture index digest.
    image: qmcgaw/gluetun@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: safebrowse-vpn
    # Every container of a VPN session carries the SHA-256 of the generated
    # WireGuard file it was created with; the launcher checks a stored file
    # against it before reusing it. A hash of the file, never its contents.
    labels:
      safebrowse.schema: "1"
      safebrowse.session: ${SAFEBROWSE_SESSION:-manual}
      safebrowse.mode: vpn
      safebrowse.vpn-config-sha256: ${SAFEBROWSE_VPN_FINGERPRINT:-}
    networks:
      # The firewall rules name these interfaces, so they are fixed here rather
      # than left to the order Docker happens to attach networks in.
      sandbox_net:
        aliases:
          - gateway          # only on the sandbox bridge; Squid answers on :3128
        driver_opts:
          com.docker.network.endpoint.ifname: sbx0
      egress_net:
        driver_opts:
          com.docker.network.endpoint.ifname: egr0
    # No ports: nothing in this namespace is published to the host.
    volumes:
      # Generated by the launcher from your WireGuard file; private key inside.
      - type: bind
        source: ${SAFEBROWSE_VPN_DIR:-./.runtime/vpn/none}/wg0.conf
        target: /run/secrets/wg0.conf
        read_only: true
        bind:
          create_host_path: false
      # Firewall rules Gluetun applies as part of enabling its own firewall.
      - type: bind
        source: ${SAFEBROWSE_VPN_DIR:-./.runtime/vpn/none}/post-rules.txt
        target: /iptables/post-rules.txt
        read_only: true
        bind:
          create_host_path: false
      # Leaves only GET /v1/version open on the loopback control server.
      - type: bind
        source: ./security/gluetun-auth.toml
        target: /gluetun/auth/config.toml
        read_only: true
        bind:
          create_host_path: false
    environment:
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      # Kernel WireGuard needs no /dev/net/tun. The userspace fallback is not configured.
      - WIREGUARD_IMPLEMENTATION=kernelspace
      - WIREGUARD_ALLOWED_IPS=0.0.0.0/0        # IPv4 only; Gluetun's default adds ::/0
      - WIREGUARD_MTU=${SAFEBROWSE_VPN_MTU:-1320}
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=${SAFEBROWSE_VPN_KEEPALIVE:-0}
      # No listener but loopback. The control server cannot be switched off in this release.
      - HTTP_CONTROL_SERVER_ADDRESS=127.0.0.1:8000
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999
      - DNS_SERVER=off
      - HTTPPROXY=off
      - SHADOWSOCKS=off
      - PPROF_ENABLED=no
      # No lookups or downloads beyond the health checks below.
      - PUBLICIP_ENABLED=off
      - VERSION_INFORMATION=off
      - UPDATER_PERIOD=0
      - BLOCK_MALICIOUS=off
      - BLOCK_SURVEILLANCE=off
      - BLOCK_ADS=off
      - STORAGE_FILEPATH=
      # Health checks go through the tunnel to the resolvers Squid already uses.
      - HEALTH_TARGET_ADDRESSES=94.140.14.14:53,94.140.15.15:53
      - HEALTH_ICMP_TARGET_IPS=94.140.14.14,94.140.15.15
      - HEALTH_RESTART_VPN=on
      # The info level prints a shortened private key in the settings summary.
      - LOG_LEVEL=warn
      - FIREWALL_DEBUG=off
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN       # WireGuard interface, routes and firewall inside this namespace
      - DAC_OVERRIDE    # read the 0600 configuration owned by the user who launched (Linux)
    mem_limit: 256m
    pids_limit: 128
    restart: "no"

  gateway:
    extends:
      file: compose.services.yml
      service: gateway
    labels:
      safebrowse.mode: vpn
      safebrowse.vpn-config-sha256: ${SAFEBROWSE_VPN_FINGERPRINT:-}
    # No networks and no hostname: this container has no network identity of its own.
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  uiproxy:
    extends:
      file: compose.services.yml
      service: uiproxy
    labels:
      safebrowse.mode: vpn
      safebrowse.vpn-config-sha256: ${SAFEBROWSE_VPN_FINGERPRINT:-}
    # Outside the VPN namespace, so the desktop stays reachable for diagnosis
    # when the tunnel is down.
    networks:
      sandbox_net:
      egress_net:
    depends_on:
      - safebrowse

  safebrowse:
    extends:
      file: compose.services.yml
      service: safebrowse
    labels:
      safebrowse.mode: vpn
      safebrowse.vpn-config-sha256: ${SAFEBROWSE_VPN_FINGERPRINT:-}
    # No ports. No route off sandbox_net except through gateway.
    networks:
      sandbox_net:
    depends_on:
      - gateway

# Keep these two definitions identical in docker-compose.yml.
networks:
  # internal: true means Docker installs a firewall rule dropping anything
  # entering this bridge from outside its own subnet, and gives members no
  # NAT to the internet. Isolated gateway mode also removes the bridge host address.
  sandbox_net:
    name: safebrowse_sandbox
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config:
        # run.sh supplies an unused subnet; this fallback supports direct Compose use.
        - subnet: ${SANDBOX_SUBNET:-172.28.0.0/24}

  egress_net:
    name: safebrowse_egress
    driver: bridge
