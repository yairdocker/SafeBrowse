# ---------------------------------------------------------------------------
# safebrowse egress gateway.
# The browser has no route to the internet at all; this is its only way out.
# ---------------------------------------------------------------------------

http_port 3128

# --- who is allowed to use this proxy --------------------------------------
acl sandbox src 172.28.0.0/24          # the internal sandbox network, nothing else

# --- where they are allowed to go ------------------------------------------
acl SSL_ports  port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT    method CONNECT

# Private space, link-local and loopback are resolved-then-checked by Squid,
# so a hostname that resolves into your LAN is blocked too (DNS rebinding).
acl to_private dst 10.0.0.0/8
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16
acl to_private dst 169.254.0.0/16
acl to_private dst 127.0.0.0/8
acl to_private dst fc00::/7
acl to_private dst fe80::/10
acl to_private dst ::1

acl blocked dstdomain "/etc/squid/blocklist.txt"

# Order matters: denials first, then the single allow.
http_access deny to_private             # no LAN, no host.docker.internal, no loopback
http_access deny blocked
http_access deny !Safe_ports            # only 80 and 443 leave this network
http_access deny CONNECT !SSL_ports
http_access allow sandbox
http_access deny all

# --- upstream DNS ----------------------------------------------------------
# All name resolution for the sandbox happens here, on AdGuard's filtering
# resolvers. The browser cannot bypass it: it never resolves anything itself.
dns_nameservers 94.140.14.14 94.140.15.15

# --- keep nothing ----------------------------------------------------------
# A cache_dir must exist or the image's `squid -z` init pass exits non-zero and
# the entrypoint aborts. `cache deny all` below means nothing is ever stored in
# it - it exists purely to satisfy that startup step.
cache_dir ufs /var/spool/squid 100 16 256
cache deny all
cache_store_log none
# NOT /dev/stdout: squid drops privileges to the 'proxy' user, and the
# container's stdout is root-owned, so opening it after setuid fails - fatally
# for access_log. Squid's own startup errors still reach `docker logs`
# regardless of these settings, so nothing is hidden by writing them here.
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
forwarded_for delete
via off
httpd_suppress_version_string on

# Do not leak the sandbox's identity upstream.
request_header_access X-Forwarded-For deny all
